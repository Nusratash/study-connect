services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: educonnect
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  adminer:
    image: adminer
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on: [postgres]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: educonnect
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports: ["4000:4000"]
    depends_on: [postgres]
    volumes: ["./backend/uploads:/app/uploads"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    restart: unless-stopped
    environment:
      API_URL: http://backend:4000/api
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
